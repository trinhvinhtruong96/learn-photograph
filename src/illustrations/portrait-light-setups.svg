<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-label="Ba cách bố trí ánh sáng chân dung, nhìn từ trên xuống: bóng râm mở, cửa sổ 45° và ngược sáng có tấm hắt sáng.">
  <title>Ba cách bố trí ánh sáng chân dung, nhìn từ trên xuống: bóng râm mở, cửa sổ 45° và ngược sáng có tấm hắt sáng.</title>
  <g transform="translate(15 0)"><rect class="i-line" x="0" y="20" width="190" height="190" rx="6"/><rect class="i-fill" x="2" y="22" width="186" height="70"/><text class="i-text-muted" x="95" y="56" text-anchor="middle">bóng râm</text><text class="i-text-muted" x="95" y="160" text-anchor="middle">trời trống</text><circle class="i-accent" cx="95" cy="110" r="14"/><rect class="i-muted i-line" x="83" y="182" width="24" height="16" rx="3"/></g><text class="i-text" x="110" y="234" text-anchor="middle">bóng râm mở</text><g transform="translate(225 0)"><rect class="i-line" x="0" y="20" width="190" height="190" rx="6"/><rect class="i-cool" x="2" y="40" width="10" height="90"/><path class="i-cool-line" d="M14 70 L80 104" stroke-dasharray="4 5"/><circle class="i-accent" cx="95" cy="110" r="14"/><rect class="i-muted i-line" x="83" y="182" width="24" height="16" rx="3"/></g><text class="i-text" x="320" y="234" text-anchor="middle">cửa sổ 45°</text><g transform="translate(435 0)"><rect class="i-line" x="0" y="20" width="190" height="190" rx="6"/><circle class="i-accent" cx="95" cy="40" r="12" opacity="0.7"/><rect class="i-fill i-line" x="140" y="132" width="36" height="10" rx="2" transform="rotate(-30 158 137)"/><path class="i-cool-line" d="M150 132 L110 116" stroke-dasharray="4 5"/><circle class="i-accent" cx="95" cy="110" r="14"/><rect class="i-muted i-line" x="83" y="182" width="24" height="16" rx="3"/></g><text class="i-text" x="530" y="234" text-anchor="middle">ngược sáng + tấm hắt</text>
