<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-label="Kính lọc ND giảm sáng theo stop: ND8 giảm 3 stop, ND64 giảm 6 và ND1000 giảm 10. Với ND1000, 1/125 giây thành khoảng 8 giây.">
  <title>Kính lọc ND giảm sáng theo stop: ND8 giảm 3 stop, ND64 giảm 6 và ND1000 giảm 10. Với ND1000, 1/125 giây thành khoảng 8 giây.</title>
  <circle class="i-line" cx="120" cy="80" r="46"/><circle class="i-text" cx="120" cy="80" r="42" opacity="0.3"/><text class="i-text" x="120" y="150" text-anchor="middle">ND8 = 3 stop</text><circle class="i-line" cx="320" cy="80" r="46"/><circle class="i-text" cx="320" cy="80" r="42" opacity="0.55"/><text class="i-text" x="320" y="150" text-anchor="middle">ND64 = 6 stop</text><circle class="i-line" cx="520" cy="80" r="46"/><circle class="i-text" cx="520" cy="80" r="42" opacity="0.85"/><text class="i-text" x="520" y="150" text-anchor="middle">ND1000 = 10 stop</text>
  <text class="i-text" x="320" y="196" text-anchor="middle">với ND1000: 1/125 giây → khoảng 8 giây</text>
</svg>
