<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="Giờ vàng kéo dài từ lúc mặt trời ở 6° trên đường chân trời đến 4° dưới. Tiếp theo là giờ xanh, kéo dài đến khoảng 6° dưới đường chân trời.">
  <title>Giờ vàng kéo dài từ lúc mặt trời ở 6° trên đường chân trời đến 4° dưới. Tiếp theo là giờ xanh, kéo dài đến khoảng 6° dưới đường chân trời.</title>
  <rect class="i-accent" x="0" y="102" width="640" height="80" opacity="0.18"/>
  <rect class="i-cool" x="0" y="182" width="640" height="16" opacity="0.35"/>
  <path class="i-line" d="M0 150 H640"/>
  <path class="i-line" d="M80 40 Q300 60 560 222" stroke-dasharray="4 6"/>
  <circle class="i-accent" cx="170" cy="102" r="12"/>
  <circle class="i-accent" cx="300" cy="150" r="12" opacity="0.8"/>
  <circle class="i-accent" cx="420" cy="182" r="12" opacity="0.5"/>
  <circle class="i-cool" cx="500" cy="198" r="12" opacity="0.7"/>
  <text class="i-text" x="190" y="96">6° trên: bắt đầu giờ vàng</text>
  <text class="i-text" x="318" y="144">hoàng hôn</text>
  <text class="i-text-muted" x="10" y="176">giờ vàng</text>
  <text class="i-text-muted" x="10" y="226">giờ xanh (4° đến 6° dưới)</text>
</svg>
