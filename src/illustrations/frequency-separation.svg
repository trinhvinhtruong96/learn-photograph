<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="Wavelet decompose tách da thành các lớp: giữ lỗ chân lông nhỏ và chỉ làm mịn các mảng loang lổ lớn.">
  <title>Wavelet decompose tách da thành các lớp: giữ lỗ chân lông nhỏ và chỉ làm mịn các mảng loang lổ lớn.</title>
