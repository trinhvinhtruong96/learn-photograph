<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" role="img" aria-label="Read a photo in four steps: describe, analyze, interpret, judge.">
  <title>Read a photo in four steps: describe, analyze, interpret, judge.</title>
  <rect class="i-fill i-line" x="14" y="50" width="138" height="90" rx="8"/><text class="i-text" x="83" y="88" text-anchor="middle">Describe</text><text class="i-text-muted" x="83" y="112" text-anchor="middle">what do I see?</text><path class="i-accent-line" d="M154 95 H170"/><rect class="i-fill i-line" x="172" y="50" width="138" height="90" rx="8"/><text class="i-text" x="241" y="88" text-anchor="middle">Analyze</text><text class="i-text-muted" x="241" y="112" text-anchor="middle">how was it made?</text><path class="i-accent-line" d="M312 95 H328"/><rect class="i-fill i-line" x="330" y="50" width="138" height="90" rx="8"/><text class="i-text" x="399" y="88" text-anchor="middle">Interpret</text><text class="i-text-muted" x="399" y="112" text-anchor="middle">what does it mean?</text><path class="i-accent-line" d="M470 95 H486"/><rect class="i-fill i-line" x="488" y="50" width="138" height="90" rx="8"/><text class="i-text" x="557" y="88" text-anchor="middle">Judge</text><text class="i-text-muted" x="557" y="112" text-anchor="middle">does it work?</text>
</svg>
