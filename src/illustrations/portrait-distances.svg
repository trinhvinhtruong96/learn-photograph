<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="Ống 85mm, cầm máy dọc: khoảng 1,5 m cho đầu và vai, 2,5 m cho nửa người, 5 m cho toàn thân.">
  <title>Ống 85mm, cầm máy dọc: khoảng 1,5 m cho đầu và vai, 2,5 m cho nửa người, 5 m cho toàn thân.</title>
  <path class="i-line" d="M20 170 H620"/>
  <circle class="i-accent" cx="580" cy="72.0" r="15.4"/><rect class="i-accent" x="567.4" y="91.6" width="25.2" height="78.4" rx="7.0"/>
  <rect class="i-muted i-line" x="460" y="104" width="20" height="32" rx="3"/><path class="i-cool-line" d="M480 120 H560" stroke-dasharray="4 5"/>
