<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Editing workflow (darktable) · Learn Photography</title>
    <meta name="description" content="Turn RAW files into finished photos in darktable." />
    <script>
      try {
        const saved = localStorage.getItem('lp:theme');
        document.documentElement.dataset.theme = saved === 'light' || saved === 'dark'
          ? saved
          : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      } catch {}
    </script>
    <link rel="stylesheet" href="/src/styles/main.css" />
    <script type="module" src="/src/js/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header id="site-header" class="site-header"></header>
    <div class="layout layout--stage">
      <nav id="toc" class="toc" aria-label="On this page"></nav>
      <main id="main" class="stage" data-stage="editing" tabindex="-1">
        <div id="stage-header" class="stage-header"></div>

        <section class="practice" id="practice">
          <h2>Practice</h2>
          <div data-checklist></div>
        </section>

        <nav id="stage-pager" class="pager wide" aria-label="Stages"></nav>
      </main>
    </div>
    <footer id="site-footer" class="site-footer"></footer>
  </body>
</html>
